<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>الصفحة غير موجودة | العد التنازلي لسنة 2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0616, #1a0b2e, #0f0c29);
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 48px 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: clamp(4rem, 15vw, 7rem);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #ff6b9d, #c44eff, #4effd0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    h2 { font-size: 1.5rem; margin-bottom: 12px; font-weight: 900; }
    p { color: #a8a8c8; margin-bottom: 28px; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #ff6b9d, #c44eff);
      color: #fff;
      text-decoration: none;
      border-radius: 100px;
      font-weight: 700;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 10px 30px rgba(196, 78, 255, 0.4);
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(196, 78, 255, 0.6); }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <h2>الصفحة غير موجودة</h2>
    <p>الرابط الذي تحاول الوصول إليه غير متاح. يمكنك العودة للصفحة الرئيسية لمشاهدة العد التنازلي لسنة 2027.</p>
    <a href="/">⬅ العودة للرئيسية</a>
  </div>
</body>
</html>
