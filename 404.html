<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0616">
  <title>الصفحة غير موجودة | العد التنازلي لسنة 2027</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a0b2e 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(196, 78, 255, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 20% 80%, rgba(78, 255, 208, 0.1) 0%, transparent 60%),
        linear-gradient(180deg, #0a0616 0%, #0f0c29 100%);
      background-attachment: fixed;
      color: #fff;
      padding: 20px 16px;
      text-align: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.4;
      will-change: transform;
    }
    .orb-1 { width: 340px; height: 340px; background: #ff6b9d; top: -120px; right: -100px; animation: float1 22s ease-in-out infinite; }
    .orb-2 { width: 300px; height: 300px; background: #c44eff; bottom: -100px; left: -80px; animation: float2 26s ease-in-out infinite; }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, 70px) scale(1.15); }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, -50px) scale(1.1); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(20, 15, 40, 0.55);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: clamp(32px, 6vw, 56px) clamp(20px, 5vw, 40px);
      max-width: 520px;
      width: 100%;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        0 0 80px rgba(196, 78, 255, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      animation: fadeInUp 0.7s ease-out both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -3px;
      background: linear-gradient(135deg, #ff6b9d 0%, #c44eff 50%, #4effd0 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 6s ease-in-out infinite;
      margin-bottom: 8px;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    h2 {
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      font-weight: 900;
      margin-bottom: 12px;
      color: #fff;
    }

    p {
      color: #a8a8c8;
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    @media (min-width: 460px) {
      .buttons {
        flex-direction: row;
        justify-content: center;
      }
      .buttons .btn { flex: 1; }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 100px;
      text-decoration: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      white-space: nowrap;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b9d 0%, #c44eff 100%);
      color: #fff;
      box-shadow: 0 10px 30px rgba(196, 78, 255, 0.45);
    }
    .btn-primary:hover, .btn-primary:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(196, 78, 255, 0.65);
      outline: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .btn-secondary:hover, .btn-secondary:focus-visible {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-3px);
      outline: none;
    }

    .btn:active { transform: translateY(0); }
    .btn svg { flex-shrink: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="card">
    <div class="code">404</div>
    <h2>الصفحة غير موجودة</h2>
    <p>الرابط الذي تحاول الوصول إليه غير متاح.<br>اضغط على الزر بالأسفل للعودة إلى صفحة العد التنازلي لسنة 2027.</p>

    <div class="buttons">
      <a href="#" id="home-btn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>العودة للعد التنازلي</span>
      </a>

      <a href="#" id="back-btn" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>رجوع</span>
      </a>
    </div>
  </div>

<script>
(function () {
  'use strict';

  /* ============================================================
     ⚠️ إعداد مهم — اقرأه بعناية
     ============================================================
     
     اترك هذا المتغير "" فارغًا ليعمل الكشف التلقائي.
     
     إذا لم يعمل الكشف التلقائي، املأ اسم المستودع يدويًا.
     مثال: إذا كان رابط موقعك هو:
        https://ahmed.github.io/countdown-2027/
     فاكتب:
        var REPO_NAME = "countdown-2027";
     
     وإذا كان رابط موقعك هو (موقع رئيسي):
        https://ahmed.github.io/
     فاتركه فارغًا:
        var REPO_NAME = "";
     
     ============================================================ */
  var REPO_NAME = "";

  /* ============================================================
     لا تعدل شيئًا تحت هذا السطر
     ============================================================ */

  function getHomeUrl() {
    // 1) إذا حدد المستخدم اسم المستودع يدويًا — استخدمه مباشرة
    if (REPO_NAME && REPO_NAME.trim() !== '') {
      var clean = REPO_NAME.replace(/^\/+|\/+$/g, '');
      return '/' + clean + '/';
    }

    // 2) كشف تلقائي
    var pathname = window.location.pathname || '/';
    var hostname = window.location.hostname || '';
    var segments = pathname.split('/').filter(function (s) { return s.length > 0; });

    // حالة GitHub Pages (سواء user site أو project site)
    var isGithubPages = hostname.indexOf('.github.io') !== -1;

    if (isGithubPages) {
      // username.github.io/REPO/... → 2+ أجزاء تعني أن الجزء الأول هو اسم المستودع
      if (segments.length >= 2) {
        return '/' + segments[0] + '/';
      }
      // username.github.io/wrong → user site، ارجع للجذر
      return '/';
    }

    // نطاق مخصص (custom domain) — ارجع للجذر
    return '/';
  }

  var homeUrl = getHomeUrl();

  // زر العودة للعد التنازلي
  var homeBtn = document.getElementById('home-btn');
  if (homeBtn) {
    homeBtn.setAttribute('href', homeUrl);
    homeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      window.location.href = homeUrl;
    });
  }

  // زر الرجوع (لتاريخ المتصفح أو للرئيسية إن لم يوجد)
  var backBtn = document.getElementById('back-btn');
  if (backBtn) {
    backBtn.setAttribute('href', homeUrl);
    backBtn.addEventListener('click', function (e) {
      e.preventDefault();
      // إن كان المستخدم قادمًا من صفحة داخلية، ارجع لتاريخ المتصفح
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        // وإلا اذهب للرئيسية
        window.location.href = homeUrl;
      }
    });
  }

  // إظهار الرابط النهائي في console للتشخيص (اختياري)
  if (window.console && console.log) {
    console.log('[404] Home URL detected:', homeUrl);
  }
})();
</script>
</body>
</html>
