  @media print {
    .bg, .orb { display: none; }
    body { background: #fff; color: #000; }
  }
</style>

<script>
(function () {
  'use strict';

  /* ============ الإعدادات ============ */
  var TARGET = { year: 2027, month: 0, day: 1, hour: 0, minute: 0, second: 0 };

  /* ============ العناصر ============ */
  var tzSelect       = document.getElementById('tz-select');
  var tzOffset       = document.getElementById('tz-offset');
  var currentTimeEl  = document.getElementById('current-time');
  var currentDateEl  = document.getElementById('current-date');

  var minutesEl      = document.getElementById('minutes');
  var secondsEl      = document.getElementById('seconds');
  var progressPctEl  = document.getElementById('progress-percent');
  var progressFillEl = document.getElementById('progress-fill');
  var footerYearEl   = document.getElementById('footer-year');

  /* ============ حالة داخلية ============ */
  var intervalId   = null;
  var targetTs     = null;
  var cachedTz     = null;
  var cachedFmt    = null;
  var cachedDateFmt = null;

  /* ============ أدوات مساعدة ============ */

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  // يُخزن المنسق مرة واحدة لكل منطقة زمنية (تحسين أداء — لا لاغ)
  function getPartsInTimeZone(date, timeZone) {
    if (cachedTz !== timeZone) {
      cachedTz = timeZone;
      cachedFmt = new Intl.DateTimeFormat('en-US', {
        timeZone: timeZone,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false
      });
      cachedDateFmt = new Intl.DateTimeFormat('ar-EG', {
        timeZone: timeZone,
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    var parts = cachedFmt.formatToParts(date);
    var o = {};
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.type !== 'literal') o[p.type] = parseInt(p.value, 10);
    }
    if (o.hour === 24) o.hour = 0;
    return o;
  }

  // حساب الطابع الزمني UTC الذي يوافق 2027-01-01 00:00:00 في المنطقة المختارة
  // (طريقة تكرارية دقيقة تتجنب مشاكل التوقيت الصيفي)
  function computeTargetTimestamp(timeZone) {
    var desiredUTC = Date.UTC(
      TARGET.year, TARGET.month, TARGET.day,
      TARGET.hour, TARGET.minute, TARGET.second
    );
    var ts = desiredUTC;
    try {
      for (var i = 0; i < 4; i++) {
        var p = getPartsInTimeZone(new Date(ts), timeZone);
        var localAsUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
        var diff = desiredUTC - localAsUTC;
        if (diff === 0) break;
        ts += diff;
      }
    } catch (e) {
      return desiredUTC;
    }
    return ts;
  }

  // عرض إزاحة المنطقة الزمنية مثل "UTC+03:00"
  function getOffsetLabel(timeZone) {
    try {
      var parts = new Intl.DateTimeFormat('en-US', {
        timeZone: timeZone,
        timeZoneName: 'longOffset'
      }).formatToParts(new Date());
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].type === 'timeZoneName') {
          var v = parts[i].value;
          return v === 'GMT' ? 'UTC+00:00' : v.replace('GMT', 'UTC');
        }
      }
    } catch (e) {}
    return '';
  }

  /* ============ قائمة المناطق الزمنية ============ */

  var REGION_NAMES = {
    'Africa': 'أفريقيا',
    'America': 'الأمريكتان',
    'Antarctica': 'القارة القطبية الجنوبية',
    'Asia': 'آسيا',
    'Atlantic': 'المحيط الأطلسي',
    'Australia': 'أستراليا',
    'Europe': 'أوروبا',
    'Indian': 'المحيط الهندي',
    'Pacific': 'المحيط الهادئ',
    'UTC': 'التوقيت العالمي'
  };

  // قائمة احتياطية شاملة (تُستخدم فقط إن لم يدعم المتصفح Intl.supportedValuesOf)
  var FALLBACK_TZ = [
    'UTC',
    'Africa/Abidjan','Africa/Accra','Africa/Addis_Ababa','Africa/Algiers','Africa/Cairo','Africa/Casablanca',
    'Africa/Dakar','Africa/Johannesburg','Africa/Khartoum','Africa/Lagos','Africa/Nairobi','Africa/Tripoli','Africa/Tunis',
    'America/Anchorage','America/Bogota','America/Buenos_Aires','America/Caracas','America/Chicago','America/Denver',
    'America/Havana','America/Lima','America/Los_Angeles','America/Mexico_City','America/New_York','America/Panama',
    'America/Phoenix','America/Santiago','America/Sao_Paulo','America/Toronto','America/Vancouver',
    'Asia/Almaty','Asia/Amman','Asia/Baghdad','Asia/Bahrain','Asia/Bangkok','Asia/Beirut','Asia/Damascus','Asia/Dhaka',
    'Asia/Dubai','Asia/Gaza','Asia/Hong_Kong','Asia/Jakarta','Asia/Jerusalem','Asia/Kabul','Asia/Karachi','Asia/Kathmandu',
    'Asia/Kolkata','Asia/Kuala_Lumpur','Asia/Kuwait','Asia/Manila','Asia/Muscat','Asia/Qatar','Asia/Riyadh','Asia/Seoul',
    'Asia/Shanghai','Asia/Singapore','Asia/Taipei','Asia/Tashkent','Asia/Tehran','Asia/Tokyo',
    'Atlantic/Azores','Atlantic/Reykjavik',
    'Australia/Adelaide','Australia/Brisbane','Australia/Darwin','Australia/Melbourne','Australia/Perth','Australia/Sydney',
    'Europe/Amsterdam','Europe/Athens','Europe/Berlin','Europe/Brussels','Europe/Bucharest','Europe/Budapest',
    'Europe/Copenhagen','Europe/Dublin','Europe/Helsinki','Europe/Istanbul','Europe/Kiev','Europe/Lisbon','Europe/London',
    'Europe/Madrid','Europe/Moscow','Europe/Oslo','Europe/Paris','Europe/Prague','Europe/Rome','Europe/Stockholm',
    'Europe/Vienna','Europe/Warsaw','Europe/Zurich',
    'Indian/Maldives','Indian/Mauritius',
    'Pacific/Auckland','Pacific/Fiji','Pacific/Honolulu'
  ];

  function getAllTimeZones() {
    try {
      if (typeof Intl !== 'undefined' && typeof Intl.supportedValuesOf === 'function') {
        var list = Intl.supportedValuesOf('timeZone');
        if (list && list.length) {
          var arr = list.slice();
          if (arr.indexOf('UTC') === -1) arr.unshift('UTC');
          return arr;
        }
      }
    } catch (e) {}
    return FALLBACK_TZ.slice();
  }

  function populateTimeZones() {
    var zones = getAllTimeZones();
    var groups = {};
    var i, tz, region, slash;

    for (i = 0; i < zones.length; i++) {
      tz = zones[i];
      slash = tz.indexOf('/');
      region = slash === -1 ? 'UTC' : tz.substring(0, slash);
      if (!groups[region]) groups[region] = [];
      groups[region].push(tz);
    }

    // ترتيب المناطق
    var order = ['UTC','Africa','America','Antarctica','Asia','Atlantic','Australia','Europe','Indian','Pacific'];
    var regions = Object.keys(groups).sort(function (a, b) {
      var ai = order.indexOf(a), bi = order.indexOf(b);
      if (ai === -1 && bi === -1) return a < b ? -1 : 1;
      if (ai === -1) return 1;
      if (bi === -1) return -1;
      return ai - bi;
    });

    var frag = document.createDocumentFragment();
    for (i = 0; i < regions.length; i++) {
      region = regions[i];
      var og = document.createElement('optgroup');
      og.label = REGION_NAMES[region] || region;
      var list = groups[region].sort();
      for (var j = 0; j < list.length; j++) {
        var opt = document.createElement('option');
        opt.value = list[j];
        opt.textContent = list[j].replace(/_/g, ' ');
        og.appendChild(opt);
      }
      frag.appendChild(og);
    }
    tzSelect.appendChild(frag);

    // اختيار منطقة المستخدم المحلية كافتراضي
    var localTZ = 'UTC';
    try {
      localTZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
    } catch (e) {}

    var exists = false;
    for (i = 0; i < tzSelect.options.length; i++) {
      if (tzSelect.options[i].value === localTZ) { exists = true; break; }
    }
    if (!exists && localTZ) {
      var extra = document.createElement('option');
      extra.value = localTZ;
      extra.textContent = localTZ.replace(/_/g, ' ');
      tzSelect.appendChild(extra);
    }
    tzSelect.value = localTZ;
  }

  /* ============ التحديث الدوري ============ */

  function updateCountdown() {
    var tz = tzSelect.value;
    if (!tz || targetTs === null) return;

    var now = Date.now();
    var diff = targetTs - now;
    if (diff < 0) diff = 0;

    var totalSec = Math.floor(diff / 1000);
    var d = Math.floor(totalSec / 86400);
    var h = Math.floor((totalSec % 86400) / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;

    daysEl.textContent    = pad(d);
    hoursEl.textContent   = pad(h);
    minutesEl.textContent = pad(m);
    secondsEl.textContent = pad(s);

    // الوقت الحالي في المنطقة المختارة
    var nowDate = new Date();
    var p = getPartsInTimeZone(nowDate, tz);
    currentTimeEl.textContent = pad(p.hour) + ':' + pad(p.minute) + ':' + pad(p.second);
    if (currentDateEl.textContent === '—') {
      try { currentDateEl.textContent = cachedDateFmt.format(nowDate); } catch (e) {}
    } else {
      try { currentDateEl.textContent = cachedDateFmt.format(nowDate); } catch (e) {}
    }
    currentYearEl.textContent = p.year;
    footerYearEl.textContent  = p.year;

    // نسبة تقدم السنة الحالية في المنطقة المختارة
    var yearStart = Date.UTC(p.year, 0, 1, 0, 0, 0);
    var yearEnd   = Date.UTC(p.year + 1, 0, 1, 0, 0, 0);
    var nowLocalUTC = Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second);
    var pct = ((nowLocalUTC - yearStart) / (yearEnd - yearStart)) * 100;
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    progressPctEl.textContent = pct.toFixed(1) + '%';
    progressFillEl.style.width = pct + '%';
  }

  function startCountdown() {
    if (intervalId) clearInterval(intervalId);
    updateCountdown();
    intervalId = setInterval(updateCountdown, 1000);
  }

  function onTimezoneChange() {
    var tz = tzSelect.value;
    if (!tz) return;

    // إعادة تعيين الكاش لأن المنطقة تغيّرت
    cachedTz = null;
    cachedFmt = null;
    cachedDateFmt = null;

    targetTs = computeTargetTimestamp(tz);
    tzOffset.textContent = getOffsetLabel(tz) || '—';

    // إجبار تحديث التاريخ
    currentDateEl.textContent = '—';

    startCountdown();
  }

  /* ============ التهيئة ============ */

  function init() {
    populateTimeZones();
    tzSelect.addEventListener('change', onTimezoneChange);
    onTimezoneChange();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
